<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animiertes Sonnensystem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0a2a, #000000);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .solar-system {
            position: relative;
            width: 900px;
            height: 900px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.85);
        }

        /* Die Sonne */
        .sun {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #fff7b0, #ffcc00, #ff8800);
            border-radius: 50%;
            box-shadow: 0 0 60px #ffaa00, 0 0 120px #ff8800, 0 0 200px #ff4400;
            z-index: 10;
            animation: sunGlow 2s infinite alternate;
        }

        @keyframes sunGlow {
            0% { box-shadow: 0 0 50px #ffaa00, 0 0 100px #ff8800, 0 0 150px #ff4400; }
            100% { box-shadow: 0 0 80px #ffcc00, 0 0 140px #ffaa00, 0 0 250px #ff6600; }
        }

        /* Gemeinsame Orbit-Stile */
        .orbit {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotate linear infinite;
        }

        /* Planet – allgemein */
        .planet {
            position: absolute;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Merkur */
        .orbit-mercury {
            width: 160px;
            height: 160px;
            animation-duration: 6s;
        }
        .mercury {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #b0b0b0, #7a7a7a, #4a4a4a);
            margin-left: -7px;
            margin-top: -7px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
        }

        /* Venus */
        .orbit-venus {
            width: 230px;
            height: 230px;
            animation-duration: 10s;
        }
        .venus {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, #f5e6b8, #e6b87a, #c49a4a);
            margin-left: -11px;
            margin-top: -11px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
        }

        /* Erde */
        .orbit-earth {
            width: 310px;
            height: 310px;
            animation-duration: 14s;
        }
        .earth {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 35% 35%, #6ab0ff, #1e6fbf, #0a3d6b);
            margin-left: -12px;
            margin-top: -12px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #1e6fbf80;
        }

        /* Mars */
        .orbit-mars {
            width: 390px;
            height: 390px;
            animation-duration: 18s;
        }
        .mars {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #e07a5f, #b84a2e, #7a2e1a);
            margin-left: -10px;
            margin-top: -10px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
        }

        /* Jupiter */
        .orbit-jupiter {
            width: 490px;
            height: 490px;
            animation-duration: 26s;
        }
        .jupiter {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 30% 30%, #e0c090, #c49a4a, #8b6b2e);
            margin-left: -22px;
            margin-top: -22px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #c49a4a80;
        }

        /* Saturn (mit Ring) */
        .orbit-saturn {
            width: 610px;
            height: 610px;
            animation-duration: 34s;
        }
        .saturn-container {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            margin-left: -20px;
            margin-top: -20px;
        }
        .saturn {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 30% 30%, #e8d5a0, #d4b87a, #a8894a);
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #d4b87a80;
        }
        .saturn-ring {
            position: absolute;
            width: 60px;
            height: 20px;
            border: 4px solid rgba(210, 180, 120, 0.7);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotateX(70deg);
            box-shadow: 0 0 15px rgba(210, 180, 120, 0.3);
        }

        /* Uranus */
        .orbit-uranus {
            width: 720px;
            height: 720px;
            animation-duration: 44s;
        }
        .uranus {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #b0e0e6, #7ac4d4, #4a8a9a);
            margin-left: -15px;
            margin-top: -15px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
        }

        /* Neptun */
        .orbit-neptune {
            width: 820px;
            height: 820px;
            animation-duration: 54s;
        }
        .neptune {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #6a9aff, #3a6ad4, #1a3a8a);
            margin-left: -14px;
            margin-top: -14px;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #3a6ad480;
        }

        /* Animation für die Rotation */
        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Beschriftung (optional, klein) */
        .label {
            position: absolute;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        /* Statischer Hintergrund-Sternenhimmel */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: transparent;
            z-index: -1;
        }

        .stars::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, transparent),
                radial-gradient(2px 2px at 40px 70px, #ffffff, transparent),
                radial-gradient(2px 2px at 50px 160px, #ffffff, transparent),
                radial-gradient(2px 2px at 90px 40px, #ffffff, transparent),
                radial-gradient(2px 2px at 130px 80px, #ffffff, transparent),
                radial-gradient(2px 2px at 160px 120px, #ffffff, transparent),
                radial-gradient(2px 2px at 200px 50px, #ffffff, transparent),
                radial-gradient(2px 2px at 250px 180px, #ffffff, transparent),
                radial-gradient(2px 2px at 300px 90px, #ffffff, transparent),
                radial-gradient(2px 2px at 350px 140px, #ffffff, transparent),
                radial-gradient(2px 2px at 400px 20px, #ffffff, transparent),
                radial-gradient(2px 2px at 450px 200px, #ffffff, transparent),
                radial-gradient(2px 2px at 500px 110px, #ffffff, transparent),
                radial-gradient(2px 2px at 550px 60px, #ffffff, transparent),
                radial-gradient(2px 2px at 600px 170px, #ffffff, transparent),
                radial-gradient(2px 2px at 650px 30px, #ffffff, transparent),
                radial-gradient(2px 2px at 700px 150px, #ffffff, transparent),
                radial-gradient(2px 2px at 750px 80px, #ffffff, transparent),
                radial-gradient(2px 2px at 800px 190px, #ffffff, transparent),
                radial-gradient(2px 2px at 850px 100px, #ffffff, transparent);
            background-repeat: repeat;
            background-size: 900px 250px;
            opacity: 0.8;
        }

        /* Responsive Anpassung */
        @media (max-width: 1000px) {
            .solar-system {
                transform: scale(0.6);
            }
        }
        @media (max-width: 700px) {
            .solar-system {
                transform: scale(0.4);
            }
        }
        @media (max-width: 500px) {
            .solar-system {
                transform: scale(0.3);
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="solar-system">
        <!-- Sonne -->
        <div class="sun"></div>

        <!-- Merkur -->
        <div class="orbit orbit-mercury">
            <div class="planet mercury"></div>
        </div>

        <!-- Venus -->
        <div class="orbit orbit-venus">
            <div class="planet venus"></div>
        </div>

        <!-- Erde -->
        <div class="orbit orbit-earth">
            <div class="planet earth"></div>
        </div>

        <!-- Mars -->
        <div class="orbit orbit-mars">
            <div class="planet mars"></div>
        </div>

        <!-- Jupiter -->
        <div class="orbit orbit-jupiter">
            <div class="planet jupiter"></div>
        </div>

        <!-- Saturn -->
        <div class="orbit orbit-saturn">
            <div class="saturn-container">
                <div class="saturn"></div>
                <div class="saturn-ring"></div>
            </div>
        </div>

        <!-- Uranus -->
        <div class="orbit orbit-uranus">
            <div class="planet uranus"></div>
        </div>

        <!-- Neptun -->
        <div class="orbit orbit-neptune">
            <div class="planet neptune"></div>
        </div>
    </div>
</body>
</html>
